<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 160" width="620" height="160" role="img" aria-labelledby="title desc" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="title">Digital Ethereal logo</title>
  <desc id="desc">Burgundy rounded square with a white eye-like mark, followed by the wordmark Digital Ethereal</desc>

  <!-- Mark -->
  <rect x="20" y="20" width="120" height="120" rx="28" ry="28" fill="#6D001A"/>
  <ellipse cx="80" cy="80" rx="40" ry="24" fill="none" stroke="#FFFFFF" stroke-width="6"/>
  <circle cx="80" cy="80" r="11" fill="#FFFFFF"/>

  <!-- Wordmark -->
  <text x="170" y="100" font-family="Manrope, Inter, 'Helvetica Neue', Arial, sans-serif" font-size="56" font-weight="800" letter-spacing="-1">
    <tspan fill="#000000">Digital</tspan><tspan fill="#6D001A" font-style="italic" dx="12">Ethereal</tspan>
  </text>
</svg>
